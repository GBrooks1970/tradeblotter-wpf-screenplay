name: Windows desktop CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build and verify WPF desktop
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - name: Restore, build and test
        run: ./scripts/verify-ci.ps1
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/ci/
          if-no-files-found: error
          retention-days: 7

  winappdriver:
    name: WinAppDriver BDD parity
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned protocol proxy
        run: npm ci --ignore-scripts --prefix tools/winappdriver
      - name: Provision disposable Windows runner
        run: ./scripts/setup-winappdriver-ci.ps1
      - name: Execute unchanged BDD suite through WinAppDriver
        run: ./scripts/run-bdd.ps1 --driver=winappdriver
      - name: Retain parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winappdriver-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/winappdriver/
            !TestResults/winappdriver/**/appium-home/**
          if-no-files-found: warn
          retention-days: 7
